<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Profile Finder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="box">
      <!-- Header -->
      <header>
        <div class="header">
          <h1 id="headingText">Github Profile Finder</h1>
        </div>
      </header>

      <!-- Input User -->
      <div class="findUser">
        <form action="" id="userForm">
          <input type="text" id="inputUser" placeholder="Search User" />
          <button type="submit" id="finduserBtn">Find User</button>
          <p id="errorMessage"></p>
          <p id="searching"></p>
        </form>
      </div>

      <main>
        <div class="user">
          <!-- User Image. -->
          <div class="profileImage">
            <img id="profileIcon" />
          </div>

          <div class="userDetails">
            <p id="name"><strong>Name:</strong></p>
            <p id="bio"><strong>Bio:</strong></p>
            <p id="userName"><strong>Username:</strong></p>
            <p id="country"><strong>Country:</strong></p>
            <p id="email"><strong>Email:</strong></p>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
