<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="box">
    <!-- Header -->
    <header>
        <div class="header">
            <h1 id="headingText">Random User Finder</h1>
        </div>
    </header>

    <!-- Input User -->

    <main>
        <div class="findUser">
            <form action="" id="userForm">
                <input type="text" id="inputUser">
                <button type="submit" id="finduserBtn">Find User</button>
                <p id="erroMessage"></p>
                <p id="loading"></p>
            </form>
        </div>
    </main>
  
</div>
<script src="script.js"></script>
</body>
</html>
